# AED Inspection SaaS — abada-65 production stack
# All persistent data lives under /data/saas-aed/ (per abada-65 convention)
name: saas-aed

services:
  postgres:
    image: postgres:16-alpine
    container_name: aed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aed}
      TZ: Asia/Seoul
    volumes:
      - /data/saas-aed/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aed} -d ${POSTGRES_DB:-aed}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [aed-net]

  redis:
    image: redis:7-alpine
    container_name: aed-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - /data/saas-aed/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [aed-net]

  app:
    image: ghcr.io/saintgo7/saas-aed:${APP_TAG:-latest}
    container_name: aed-app
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-aed}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aed}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [aed-net]

  cron-worker:
    image: ghcr.io/saintgo7/saas-aed:${APP_TAG:-latest}
    container_name: aed-cron
    restart: unless-stopped
    command: ["node", "dist/server/cron/index.js"]
    env_file: .env.production
    environment:
      NODE_ENV: production
      CRON_ENABLED: "true"
      CRON_TIMEZONE: Asia/Seoul
      DATABASE_URL: postgresql://${POSTGRES_USER:-aed}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aed}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [aed-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: aed-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /data/saas-aed/nginx-cache:/var/cache/nginx
    depends_on:
      - app
    networks: [aed-net]

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aed-cloudflared
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARED_TOKEN}"]
    depends_on:
      - nginx
    networks: [aed-net]

networks:
  aed-net:
    driver: bridge
