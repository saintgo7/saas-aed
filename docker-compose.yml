# AED Inspection SaaS — abada-65 production stack
# Convention: /data/abada-kr/aed-abada-kr/aed.abada.kr/
# Cloudflared single tunnel routes aed.abada.kr -> 127.0.0.1:10370 (host-level, NOT here)
name: aed

services:
  app:
    build: ./src
    container_name: aed-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:10370:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-aed}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aed}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [aed-prod-net]

  postgres:
    image: postgres:16-alpine
    container_name: aed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aed}
      TZ: Asia/Seoul
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aed} -d ${POSTGRES_DB:-aed}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [aed-prod-net]

  redis:
    image: redis:7-alpine
    container_name: aed-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [aed-prod-net]

networks:
  aed-prod-net:
    name: aed-prod-net
