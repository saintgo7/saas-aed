name: Deploy to abada-65

# Connection path: GitHub runner → bastion (61.245.248.247:5022) → abada-65 (172.16.129.65:5022)
# The same deploy key authenticates at both hops (registered in both authorized_keys).
#
# Required secrets (production environment):
#   ABADA65_USER          — SSH user on abada-65 (blackpc)
#   ABADA65_HOST          — abada-65 internal IP (172.16.129.65)
#   ABADA65_PORT          — SSH port on both hops (5022)
#   ABADA65_BASTION_HOST  — public bastion (61.245.248.247)
#   ABADA65_SSH_KEY       — deploy-only ed25519 private key

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH deploy via bastion
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ABADA65_HOST }}
          port: ${{ secrets.ABADA65_PORT }}
          username: ${{ secrets.ABADA65_USER }}
          key: ${{ secrets.ABADA65_SSH_KEY }}
          proxy_host: ${{ secrets.ABADA65_BASTION_HOST }}
          proxy_port: ${{ secrets.ABADA65_PORT }}
          proxy_username: ${{ secrets.ABADA65_USER }}
          proxy_key: ${{ secrets.ABADA65_SSH_KEY }}
          script: |
            set -euo pipefail
            BASE=/data/abada-kr/aed-abada-kr/aed.abada.kr
            cd "$BASE/src"
            git -c safe.directory='*' pull --ff-only origin main
            cd "$BASE"
            export APP_TAG=${{ github.sha }}
            # ghcr pull (best-effort). Falls back to local build via build: ./src
            # if the package is private and the host isn't logged in to ghcr.
            docker-compose pull app 2>&1 | tail -5 || true
            # Migrations: separate `migrator` profile image with drizzle-kit.
            # Idempotent — drizzle-kit skips already-applied migrations.
            docker-compose --profile tools build migrator
            docker-compose --profile tools run --rm migrator
            docker-compose up -d --no-deps app
            docker image prune -f

      - name: Health check
        run: |
          for i in {1..15}; do
            if curl -fsS https://aed.abada.kr/api/health > /dev/null; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
          echo "::error::Health check failed after 15 attempts"
          exit 1
