# Pandoc defaults — Korean edition (DOCX/PDF via xelatex)
# Usage:
#   pandoc --defaults=docs/book/templates/pandoc-ko.yaml ...

from: markdown+yaml_metadata_block+raw_html
pdf-engine: xelatex
toc: true
toc-depth: 3
number-sections: true
top-level-division: chapter

# Variables passed to LaTeX template
variables:
  documentclass: book
  papersize: a4
  fontsize: 10.5pt
  geometry:
    - top=22mm
    - bottom=24mm
    - left=22mm
    - right=22mm
  linestretch: 1.45
  colorlinks: true
  linkcolor: NavyBlue
  urlcolor: NavyBlue
  citecolor: NavyBlue
  toccolor: black

  # Korean fonts — using macOS system fonts (Apple SD Gothic Neo)
  # Replace with Pretendard if installed: brew install --cask font-pretendard
  mainfont: "Apple SD Gothic Neo"
  sansfont: "Apple SD Gothic Neo"
  monofont: "Menlo"
  CJKmainfont: "Apple SD Gothic Neo"
  CJKsansfont: "Apple SD Gothic Neo"
  CJKmonofont: "Apple SD Gothic Neo"

  # Title page
  title-meta: "AED 점검 SaaS, 0에서 운영까지"
  author-meta: "e8both"
  lang: "ko-KR"

# Filters / extensions
metadata:
  lang: ko-KR

# Image and code rendering
highlight-style: tango
default-image-extension: png

# Section numbering
shift-heading-level-by: 0
